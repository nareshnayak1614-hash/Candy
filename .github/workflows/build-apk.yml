name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VER_STR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          if [ -z "$JAVA_VER_STR" ]; then
            echo "ERROR: Could not detect Java version."
            exit 1
          fi

          MAJOR_VERSION=$(echo "$JAVA_VER_STR" | awk -F. '{if ($1 == "1") print $2; else print $1;}')
          echo "Detected Java major version: $MAJOR_VERSION"

          if [ -z "$MAJOR_VERSION" ] || ! [ "$MAJOR_VERSION" -ge 0 ] 2>/dev/null; then
            echo "ERROR: Java major version could not be parsed as a valid integer from '$JAVA_VER_STR'."
            exit 1
          fi

          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "ERROR: Active Java major version is $MAJOR_VERSION. Java 17 or newer is required."
            exit 1
          fi
          echo "Java environment verified successfully: Java $MAJOR_VERSION (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Debug keystore already exists at $KEYSTORE_PATH."
          else
            echo "Generating temporary debug keystore at $KEYSTORE_PATH..."
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "ERROR: Failed to create or verify debug keystore at $KEYSTORE_PATH."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK at $EXPECTED_APK is empty (0 bytes)."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension: $EXPECTED_APK"; exit 1 ;;
          esac

          echo "Confirmed valid debug APK at $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK") bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "ERROR: Source APK missing or empty at $SOURCE_APK"
            exit 1
          fi

          TEMP_ASSET_DIR="${RUNNER_TEMP}/release_asset"
          rm -rf "$TEMP_ASSET_DIR"
          mkdir -p "$TEMP_ASSET_DIR"

          REPO_RAW="${GITHUB_REPOSITORY#*/}"
          REPO_CLEAN=$(echo "$REPO_RAW" | sed 's/[^a-zA-Z0-9._-]/-/g')
          if [ -z "$REPO_CLEAN" ]; then
            REPO_CLEAN="android-app"
          fi

          ASSET_FILENAME="${REPO_CLEAN}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TARGET_PATH="${TEMP_ASSET_DIR}/${ASSET_FILENAME}"

          cp "$SOURCE_APK" "$TARGET_PATH"

          if [ ! -f "$TARGET_PATH" ] || [ ! -s "$TARGET_PATH" ]; then
            echo "ERROR: Failed to prepare APK release asset at $TARGET_PATH"
            exit 1
          fi

          echo "Prepared release asset: $TARGET_PATH"
          echo "asset_path=${TARGET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Verifying GitHub CLI..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared release asset is missing or empty at '$ASSET_PATH'."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES=$(cat <<EOF
          ### Automated Debug APK Build

          - **Build Type**: Automatically generated debug APK
          - **Builder**: GitHub Actions
          - **Run Number**: ${GITHUB_RUN_NUMBER}
          - **Run Attempt**: ${GITHUB_RUN_ATTEMPT}
          - **Source Commit**: ${GITHUB_SHA}
          - **Intended Use**: Testing and evaluation
          - **Notice**: This APK is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF
          )

          echo "Publishing release with tag: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$GITHUB_SHA" \
            --latest

          echo "GitHub Release published successfully: $RELEASE_TAG"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=========================================================="
            echo "SUCCESS: GitHub Release published successfully!"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "APK Asset Filename: $ASSET_NAME"

            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")
            echo "Direct GitHub Release URL: $RELEASE_URL"
            echo "=========================================================="

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
            ## :white_check_mark: Debug APK Build & Release Succeeded!

            - **Release Tag**: \`$RELEASE_TAG\`
            - **Release Title**: Debug APK Build #${GITHUB_RUN_NUMBER}
            - **APK Asset Filename**: \`$ASSET_NAME\`
            - **Direct Download Page**: [Download APK from GitHub Releases]($RELEASE_URL)

            Download the APK file directly under the **Assets** section of the release on your phone or device.

            > **Actions Artifact Backup**: The standard GitHub Actions artifact named \`app-debug-apk\` is also available for this workflow run.
            EOF
          else
            echo "::warning::GitHub Release publishing did not complete or encountered an error."
            echo "The debug APK build succeeded and the GitHub Actions artifact 'app-debug-apk' is safely preserved."

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
            ## :warning: Debug APK Build Succeeded (Release Notice)

            - **APK Build Status**: Succeeded
            - **Actions Artifact**: \`app-debug-apk\` is available under this workflow run summary.

            > **Notice**: GitHub Release creation was bypassed or encountered an error. The compiled APK is preserved and downloadable via the \`app-debug-apk\` artifact.
            EOF
          fi
